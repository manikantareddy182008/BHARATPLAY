<!DOCTYPE html>
<html>

<head>

    <title>Login - BHARATPLAY</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-page">

<div class="auth-card">

    <div class="brand">🇮🇳 BHARATPLAY</div>

    <div class="tagline">
        Play. Explore. Remember India.
    </div>

    <h1>Welcome Back</h1>

    <p>Continue your Indian adventure.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="👤 Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="🔒 Password"
            required
        >

        <button class="main-button" type="submit">
            🎮 LOGIN
        </button>

    </form>

    <p class="account-text">
        New player?
        <a href="/register">Create Account</a>
    </p>

</div>

</body>
</html>
