<!DOCTYPE html>
<html>

<head>

    <title>Create Account - BHARATPLAY</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-page">

<div class="auth-card">

    <div class="brand">🇮🇳 BHARATPLAY</div>

    <div class="tagline">
        Play. Explore. Remember India.
    </div>

    <h1>Create Account</h1>

    <p>Begin your journey through India.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="👤 Choose username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="🔒 Create password"
            required
        >

        <button class="main-button" type="submit">
            🚀 CREATE ACCOUNT
        </button>

    </form>

    <p class="account-text">
        Already have an account?
        <a href="/">Login</a>
    </p>

</div>

</body>
</html>
