<!DOCTYPE html>
<html>

<head>

    <title>{{ game.title }} - BHARATPLAY</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="game-page">

<div class="game-topbar">

    <div>
        🇮🇳 <strong>BHARATPLAY</strong>
    </div>

    <div>
        ⭐ PlayPoints:
        <span id="score">0</span>
    </div>

    <a href="/library">
        ✕ Exit
    </a>

</div>


<div class="game-title">

    <h1>{{ game.title }}</h1>

    <p>{{ game.subtitle }}</p>

</div>


<canvas id="gameCanvas"></canvas>


<div id="gameMessage" class="game-message">

    <h2>{{ game.title }}</h2>

    <p>
        {{ game.description }}
    </p>

    <button id="startButton">
        ▶ START ADVENTURE
    </button>

</div>


<div id="controls" class="controls">

    <span>W A S D</span>
    Move

    <span>E</span>
    Investigate

</div>


<form id="scoreForm"
      method="POST"
      action="/score"
      style="display:none;">

    <input
        type="hidden"
        name="game"
        value="{{ game.title }}"
    >

    <input
        type="hidden"
        name="points"
        id="finalPoints"
        value="0"
    >

</form>


<script>

    const GAME_ID = "{{ game_id }}";

</script>

<script src="{{ url_for('static', filename='game.js') }}"></script>

</body>
</html>
